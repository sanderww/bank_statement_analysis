[project]
name = "bank-statement-analysis"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.7.1",
    "pdfplumber>=0.11.7",
    "python-dotenv>=1.0.0",
    "pydantic>=2.8.0",
    "typer>=0.12.5",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.2",
]

[project.scripts]
bank-statement-analysis = "bank_statement_analysis.main:app"
train-transactions-model = "bank_statement_analysis.train_model:main"
print-pdf-texts = "bank_statement_analysis.print_pdf_texts:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
